name: CI - Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests
        run: |
          pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-west-3
      ECR_REPOSITORY: titanic-dev-api

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Configurer les credentials AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::435466090607:role/GitHubActionsTitanicRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Connexion a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construire et pousser l'image Docker vers ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --output type=image,name=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG,push=true,oci-mediatypes=false \
            .